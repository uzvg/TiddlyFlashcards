# TiddlyFlashcards —— Anki add-on
# 只保存开发工具配置；add-on 本身不是可安装的 Python 包，
# 因此不声明 [project] / [build-system]。

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".mypy_cache", ".ruff_cache", "__pycache__"]

[tool.ruff.lint]
select = [
    "E4",  # import 相关
    "E7",  # 语句层面问题
    "E9",  # 语法/运行时错误
    "W",   # 空白与转义
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff 自有规则
]
ignore = [
    "E501",                        # 行宽交给 formatter；中文/URL 不强制折行
    "RUF001", "RUF002", "RUF003",  # 中文全角标点会误报
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
exclude = ["**/__pycache__", ".mypy_cache", ".ruff_cache"]
