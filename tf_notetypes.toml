# TiddlyFlashcards notetype 声明式定义（唯一来源，只读不改写）
# 模板中包含 {{WikiUrl}} 占位，渲染时替换为Fields中的 WikiUrl。
# type: 0 = 普通卡片（basic），1 = 填空（cloze）
# 后期，应该是

[TFBasic]
type = 0
sortf = 0

[[TFBasic.flds]]
name = "TFNoteId"
collapsed = true
prevent_deletion = true

[[TFBasic.flds]]
name = "Front"
collapsed = false
prevent_deletion = true

[[TFBasic.flds]]
name = "Back"
collapsed = false
prevent_deletion = true

[[TFBasic.flds]]
name = "Source"
collapsed = true
prevent_deletion = true

[[TFBasic.flds]]
name = "WikiName"
collapsed = true
prevent_deletion = true

[[TFBasic.flds]]
name = "WikiUrl"
collapsed = true
prevent_deletion = true

[[TFBasic.tmpls]]
name = "Card 1"
front = """
<div class="tf-card-container">
  <div class="tf-card-header">
    <div class="tf-card-id">{{TFNoteId}}</div>
    <div class="tf-card-source" data-source="{{Source}}" title="Click to copy Source">{{WikiName}}/{{Source}}</div>
  </div>
  <div class="tf-fields-container">
    <label class="tf-field-name"> Front </label>
    <div class="tf-field-value">{{Front}}</div>
  </div>
</div>
"""
back = """
<div class="tf-card-container">
  <div class="tf-card-header">
    <div class="tf-card-id">{{TFNoteId}}</div>
    <div class="tf-card-source" data-source="{{Source}}" title="Click to copy Source">{{WikiName}}/{{Source}}</div>
  </div>
  <div class="tf-fields-container">
    <label class="tf-field-name"> Front </label>
    <div class="tf-field-value">{{Front}}</div>

    <label class="tf-field-name"> Back </label>
    <div class="tf-field-value">{{Back}}</div>
  </div>
</div>
"""

