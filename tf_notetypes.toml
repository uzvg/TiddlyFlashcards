# TiddlyFlashcards notetype 声明式定义（唯一来源，只读不改写）
# 模板中包含 {{WikiUrl}} 占位，渲染时替换为Fields中的 WikiUrl。
# model_type: 0 = 普通卡片（basic），1 = 填空（cloze）

[TFBasic]
model_type = 0

[[TFBasic.fields]]
name = "Front"
collapsed = true
prevent_deletion = true

[[TFBasic.fields]]
name = "Back"
collapsed = true
prevent_deletion = true

[[TFBasic.fields]]
name = "TFNoteId"
collapsed = true
prevent_deletion = true

[[TFBasic.templates]]
name = "Card 1"
front = """
{{Front}}
"""
back = """
{{FrontSide}}
<hr id="answer">

{{Back}}

<div class="tf-link">
    <a href="{{WikiUrl}}/tiddler/{{TFNoteId}}">
        Open in TiddlyWiki
    </a>
</div>
"""

[TFCloze]
model_type = 1

[[TFCloze.fields]]
name = "Text"
collapsed = true
prevent_deletion = true

[[TFCloze.fields]]
name = "Back Extra"
collapsed = true
prevent_deletion = true

[[TFCloze.fields]]
name = "TFNoteId"
collapsed = true
prevent_deletion = true

[[TFCloze.templates]]
name = "Card 1"
front = """
{{cloze:Text}}
"""
back = """
{{cloze:Text}}

<br>

{{Back Extra}}

<div class="tf-link">
    <a href="{{WikiUrl}}/tiddler/{{TFNoteId}}">
        Open in TiddlyWiki
    </a>
</div>
"""

