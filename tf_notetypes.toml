# TiddlyFlashcards notetype 声明式定义（唯一来源，只读不改写）
# 模板中包含 {{WikiUrl}} 占位，渲染时替换为Fields中的 WikiUrl。
# type: 0 = 普通卡片（basic），1 = 填空（cloze）
# 后期，应该是

[TFBasic]
type = 0
sortf = 2

[[TFBasic.flds]]
name = "Front"
collapsed = true
prevent_deletion = true

[[TFBasic.flds]]
name = "Back"
collapsed = true
prevent_deletion = true

[[TFBasic.flds]]
name = "TFNoteId"
collapsed = true
prevent_deletion = true

[[TFBasic.tmpls]]
name = "Card 1"
front = """
{{Front}}
"""
back = """
{{FrontSide}}
<hr id="answer">

{{Back}}

<div class="tf-link">
    <a href="{{WikiUrl}}/tiddler/{{TFNoteId}}">
        Open in TiddlyWiki
    </a>
</div>
"""

[TFCloze]
type = 1
sortf = 2

[[TFCloze.flds]]
name = "Text"
collapsed = true
prevent_deletion = true

[[TFCloze.flds]]
name = "Back Extra"
collapsed = true
prevent_deletion = true

[[TFCloze.flds]]
name = "TFNoteId"
collapsed = true
prevent_deletion = true

[[TFCloze.tmpls]]
name = "Card 1"
front = """
{{cloze:Text}}
"""
back = """
{{cloze:Text}}

<br>

{{Back Extra}}

<div class="tf-link">
    <a href="{{WikiUrl}}/tiddler/{{TFNoteId}}">
        Open in TiddlyWiki
    </a>
</div>
"""

